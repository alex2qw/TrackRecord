services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./trackrecord.sqlite3:/app/data/trackrecord.sqlite3
    environment:
      TRACKRECORD_DATABASE: /app/data/trackrecord.sqlite3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
